name: Build portable BenchForge.exe

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tests/BenchForge.Core.Tests -c Release

      - name: Publish single portable exe
        run: >
          dotnet publish src/BenchForge.App/BenchForge.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:GenerateDocumentationFile=false -o publish

      - name: Partition-alignment self-test (real Windows, throw-away virtual disks)
        shell: pwsh
        run: |
          $st = Join-Path $env:RUNNER_TEMP "aligntest"
          New-Item -ItemType Directory -Force "$st\bin" | Out-Null
          Copy-Item publish\BenchForge.exe "$st\bin\"
          $p = Start-Process -FilePath "$st\bin\BenchForge.exe" -ArgumentList '--align-selftest', "$st\work" -Wait -PassThru
          Get-Content "$st\work\align-selftest.log"
          if ($p.ExitCode -ne 0) { throw "Alignment self-test failed (exit $($p.ExitCode))" }

      - name: 3D test on DirectX 11 / 12 (Microsoft WARP software renderer — the runner has no GPU)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "gputest"
          New-Item -ItemType Directory -Force "$dir\bin" | Out-Null
          Copy-Item publish\BenchForge.exe "$dir\bin\"
          $failed = $false
          foreach ($api in 'dx11', 'dx12') {
            $out = "$dir\$api.txt"
            $p = Start-Process -FilePath "$dir\bin\BenchForge.exe" -ArgumentList '--gpu-worker', '--api', $api, '--headless', '--software', '--mode', 'bench', '--duration', '40', '--width', '480', '--height', '270', '--screenshots', "$dir\shots" -RedirectStandardOutput $out -RedirectStandardError "$dir\$api.err" -Wait -PassThru
            $lines = Get-Content $out
            $lines | Where-Object { $_ -notmatch '"t":"progress"' } | ForEach-Object { Write-Host "[$api] $_" }
            Get-Content "$dir\$api.err" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "[$api stderr] $_" }
            $scenes = ($lines | Where-Object { $_ -match '"t":"scene"' }).Count
            $vramOk = ($lines | Where-Object { $_ -match '"t":"vram"' -and $_ -notmatch '"errors"' }).Count -gt 0
            $done = ($lines | Where-Object { $_ -match '"t":"done"' }).Count -gt 0
            if ($p.ExitCode -ne 0 -or $scenes -lt 4 -or -not $vramOk -or -not $done) { Write-Host "::error::$api 3D test failed (exit $($p.ExitCode), $scenes scenes, vram ok: $vramOk, done: $done)"; $failed = $true }
            else { Write-Host "$api OK: $scenes scenes, VRAM check clean" }
          }
          # An API without a driver must be reported as unavailable, not crash.
          $p = Start-Process -FilePath "$dir\bin\BenchForge.exe" -ArgumentList '--gpu-worker', '--api', 'vulkan', '--headless', '--mode', 'bench', '--duration', '5' -RedirectStandardOutput "$dir\vk.txt" -Wait -PassThru
          Write-Host "[vulkan] exit $($p.ExitCode): $(Get-Content "$dir\vk.txt" -Raw)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 2 -and $p.ExitCode -ne 3) { Write-Host "::error::Vulkan without a driver did not fail cleanly"; $failed = $true }
          if ($failed) { exit 1 }

      - name: Upload 3D test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-test-screenshots-warp
          path: ${{ runner.temp }}/gputest/shots/
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md publish/README.md
          Get-ChildItem publish
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path publish/* -DestinationPath out/BenchForge-portable-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchForge-portable-win-x64
          path: publish/

      - name: Publish download (latest build)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: BenchForge latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Portable BenchForge for Windows 10/11 (64-bit). Built from ${{ github.sha }}.
            Download the zip, extract it anywhere (e.g. a USB stick) and run BenchForge.exe as administrator.
          files: out/BenchForge-portable-win-x64.zip
